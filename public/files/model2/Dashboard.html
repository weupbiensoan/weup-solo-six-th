<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --wine:#7f1734; --wine-dark:#551023; --rose:#f7e9ed; --paper:#fffdfa;
      --ink:#251b1e; --muted:#716267; --line:#eadde1; --gold:#d99f2b;
      --green:#18794e; --green-bg:#e8f6ef; --blue:#245a9b; --blue-bg:#eaf2fb;
      --orange:#9b5b12; --orange-bg:#fff4df; --red:#a62a2a; --red-bg:#fdeaea;
    }
    *{box-sizing:border-box}
    body{margin:0;background:#f7f3f1;color:var(--ink);font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:14px;line-height:1.55}
    button,a{font:inherit}
    .header{background:linear-gradient(135deg,var(--wine-dark),var(--wine) 65%,#a72c4d);color:#fff;padding:28px 30px 30px}
    .header-row{display:flex;align-items:flex-start;gap:18px;max-width:1360px;margin:auto}
    .brand{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#ffd9e3}
    h1{font-size:28px;line-height:1.2;margin:4px 0 3px}
    .subtitle{color:#f4cbd6}
    .refresh{margin-left:auto;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:9px 17px;cursor:pointer}
    .refresh:hover{background:rgba(255,255,255,.2)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:1360px;margin:22px auto 0}
    .stat{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.17);border-radius:13px;padding:14px 16px}
    .stat strong{display:block;font-size:28px;line-height:1}.stat span{font-size:12px;color:#f4cbd6}
    main{max-width:1360px;margin:auto;padding:24px 26px 42px}
    .system-note{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:18px;color:var(--muted)}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
    .board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start}
    .lane{background:#efe9e7;border:1px solid #e2d7d4;border-radius:14px;padding:12px;min-height:260px}
    .lane-head{padding:4px 3px 12px}.lane-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
    .count{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--wine)}
    .lane-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(65,32,40,.04)}
    .card-id{font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--wine)}
    .card-title{font-size:16px;font-weight:750;margin:2px 0 1px}.card-email{font-size:11.5px;color:var(--muted);word-break:break-word}
    .chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.chip{font-size:10.5px;background:var(--rose);color:var(--wine);border-radius:999px;padding:3px 7px}
    .progress{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:8px}.metric{background:#f6f1ef;border-radius:7px;padding:6px 8px;font-size:10.5px;color:var(--muted)}.metric b{color:var(--ink)}
    .next{background:var(--orange-bg);border-left:3px solid var(--gold);border-radius:8px;padding:8px 9px;margin:10px 0;font-size:12px}.next small{display:block;color:var(--orange);font-weight:700}
    .actions{display:flex;gap:6px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px;font-weight:700}.btn:hover{background:#f8f0f2}.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff;flex:1}.btn.primary:hover{background:var(--wine-dark)}
    .empty{padding:30px 12px;text-align:center;color:#8b7b80;font-size:12px;border:1px dashed #d9cecb;border-radius:10px;background:rgba(255,255,255,.5)}
    .overlay{display:none;position:fixed;inset:0;background:rgba(34,20,24,.45);z-index:30;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}
    .dialog{background:#fff;border-radius:16px;max-width:820px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 80px rgba(30,10,17,.28)}
    .dialog-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:17px 20px;display:flex;align-items:center;gap:10px;z-index:2}.dialog-head h2{font-size:19px;margin:0}.close{margin-left:auto;border:0;background:#f4edef;border-radius:50%;width:32px;height:32px;cursor:pointer}
    .dialog-body{padding:19px 20px 24px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.detail{background:#faf7f5;border:1px solid var(--line);border-radius:9px;padding:10px}.detail label{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800}.detail div{margin-top:2px;white-space:pre-wrap;word-break:break-word}
    .section{margin-top:18px}.section h3{font-size:14px;margin:0 0 7px;color:var(--wine)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:pre-wrap}th{background:#f7f0f2;color:var(--wine);position:sticky;top:0}.link{color:var(--blue);text-decoration:none;font-weight:700}
    #toast{position:fixed;right:18px;top:18px;z-index:60;max-width:360px}.toast{background:#282024;color:#fff;border-radius:10px;padding:11px 14px;margin-bottom:8px;box-shadow:0 8px 28px rgba(0,0,0,.22)}.toast.error{background:var(--red)}
    #loading{display:none;position:fixed;inset:0;background:rgba(255,253,250,.72);z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:700;color:var(--wine)}#loading.show{display:flex}.spinner{width:34px;height:34px;border:4px solid #e8ccd4;border-top-color:var(--wine);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1050px){.board{grid-template-columns:repeat(2,minmax(260px,1fr))}}
    @media(max-width:640px){.header{padding:22px 18px}.header-row{flex-wrap:wrap}h1{font-size:23px}.refresh{margin-left:0}.stats{grid-template-columns:repeat(2,1fr)}main{padding:17px 12px 32px}.board{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.dialog-body{padding:15px}.card{padding:13px}}
  </style>
</head>
<body>
  <header class="header">
    <div class="header-row">
      <div>
        <div class="brand">WEUP SoloSix · โมเดล 2</div>
        <h1>ศูนย์ควบคุมการผลิตวิดีโอ</h1>
        <div class="subtitle">แพ็กเกจวิดีโอสั้น 12 คลิปต่อเดือน · ตลาดประเทศไทย</div>
      </div>
      <button class="refresh" onclick="loadDashboard()">โหลดข้อมูลใหม่</button>
    </div>
    <div class="stats">
      <div class="stat"><strong id="stat-intake">0</strong><span>รับข้อมูลและไฟล์</span></div>
      <div class="stat"><strong id="stat-content">0</strong><span>ไอเดียและสคริปต์</span></div>
      <div class="stat"><strong id="stat-production">0</strong><span>ผลิตและตรวจ QC</span></div>
      <div class="stat"><strong id="stat-delivered">0</strong><span>ส่งมอบแล้ว</span></div>
    </div>
  </header>

  <main>
    <div class="system-note"><span class="dot"></span><span id="system-status">กำลังอ่านข้อมูลจาก Google Sheets…</span></div>
    <div id="board" class="board"></div>
  </main>

  <div id="detail-overlay" class="overlay" onclick="closeDetails(event)">
    <div class="dialog" onclick="event.stopPropagation()">
      <div class="dialog-head"><h2 id="detail-title">รายละเอียดลูกค้า</h2><button class="close" onclick="closeDetails()" aria-label="ปิด">×</button></div>
      <div id="detail-body" class="dialog-body"></div>
    </div>
  </div>
  <div id="loading"><div class="spinner"></div><div id="loading-text">กำลังดำเนินการ…</div></div>
  <div id="toast"></div>

  <script>
    var dashboardState = null;
    var laneOrder = ['intake','content','production','delivered'];
    var actionWarnings = {
      createFolders: 'ระบบจะสร้างโฟลเดอร์ Drive และส่งลิงก์รับรูปไปยังอีเมลของลูกค้า ดำเนินการต่อหรือไม่?',
      reviewProfile: 'ระบบจะอ่านรายการไฟล์จริงและส่งเฉพาะข้อมูลธุรกิจที่ตัดข้อมูลติดต่อแล้วให้ AI ตรวจ ดำเนินการต่อหรือไม่?',
      sendMissing: 'ระบบจะส่งอีเมลขอข้อมูลเพิ่มเติมไปยังลูกค้า ดำเนินการต่อหรือไม่?',
      generateIdeas: 'ระบบจะเรียก OpenAI เพื่อสร้างไอเดีย 20 แนวจากข้อมูลและไฟล์ที่ตรวจแล้ว ดำเนินการต่อหรือไม่?',
      writeScripts: 'ระบบจะเขียนสคริปต์เฉพาะไอเดียที่ตั้งค่า APPROVAL เป็น “อนุมัติ” สูงสุด 4 รายการ ดำเนินการต่อหรือไม่?',
      buildShots: 'ระบบจะสร้างแผนภาพเฉพาะสคริปต์ที่ตั้งค่า APPROVAL เป็น “อนุมัติ” สูงสุด 4 รายการ ดำเนินการต่อหรือไม่?',
      syncQc: 'ระบบจะเทียบวิดีโอใน 04_VIDEO_FINAL กับรายการสคริปต์ และจะไม่เขียนทับหมายเหตุ QC เดิม ดำเนินการต่อหรือไม่?',
      deliver: 'คำสั่งนี้จะส่งอีเมลส่งมอบจริง ระบบจะตรวจจำนวนไฟล์และการอนุมัติสุดท้ายอีกครั้ง ดำเนินการต่อหรือไม่?',
      feedback: 'ระบบจะอ่านอีเมลที่ยังไม่ได้ประมวลผลและส่งข้อความที่จำเป็นให้ AI จัดหมวดหมู่ แต่จะไม่ตอบลูกค้าอัตโนมัติ ดำเนินการต่อหรือไม่?'
    };

    document.addEventListener('DOMContentLoaded', loadDashboard);

    function loadDashboard() {
      setLoading(true, 'กำลังอ่านข้อมูลจาก Google Sheets…');
      google.script.run
        .withSuccessHandler(function(response){
          setLoading(false);
          var data = unwrap(response);
          if (!data) return;
          dashboardState = data;
          renderDashboard(data);
        })
        .withFailureHandler(handleFailure)
        .getVideoDashboardData();
    }

    function renderDashboard(data) {
      document.getElementById('stat-intake').textContent = number(data.counts && data.counts.intake);
      document.getElementById('stat-content').textContent = number(data.counts && data.counts.content);
      document.getElementById('stat-production').textContent = number(data.counts && data.counts.production);
      document.getElementById('stat-delivered').textContent = number(data.counts && data.counts.delivered);
      document.getElementById('system-status').textContent = data.ready
        ? 'เชื่อมต่อแล้ว · โมเดล ' + (data.model || '-') + ' · อัปเดต ' + (data.generatedAt || '-')
        : (data.message || 'ระบบยังไม่พร้อม');
      var board = document.getElementById('board');
      board.innerHTML = laneOrder.map(function(key){ return renderLane(key, data.lanes && data.lanes[key]); }).join('');
    }

    function renderLane(key, lane) {
      lane = lane || {title:key,description:'',items:[]};
      var cards = lane.items && lane.items.length ? lane.items.map(renderCard).join('') : '<div class="empty">ยังไม่มีรายการในขั้นตอนนี้</div>';
      return '<section class="lane"><div class="lane-head"><div class="lane-title">' + escapeHtml(lane.title) + '<span class="count">' + number(lane.items && lane.items.length) + '</span></div><div class="lane-desc">' + escapeHtml(lane.description) + '</div></div>' + cards + '</section>';
    }

    function renderCard(item) {
      var p = item.progress || {};
      return '<article class="card">' +
        '<div class="card-id">' + escapeHtml(item.customerId) + '</div>' +
        '<div class="card-title">' + escapeHtml(item.businessName) + '</div>' +
        '<div class="card-email">' + escapeHtml(item.email || 'ไม่ระบุอีเมล') + '</div>' +
        '<div class="chips"><span class="chip">' + escapeHtml(item.profileStatus || '-') + '</span><span class="chip">รูป ' + number(item.sourceImageCount) + '</span></div>' +
        '<div class="progress"><div class="metric">ไอเดีย <b>' + number(p.approvedIdeas) + '/' + number(p.ideas) + '</b></div><div class="metric">สคริปต์ <b>' + number(p.approvedScripts) + '/' + number(p.scripts) + '</b></div><div class="metric">รายการผลิต <b>' + number(p.production) + '</b></div><div class="metric">อนุมัติสุดท้าย <b>' + number(p.approvedVideos) + '/' + number(item.expectedVideos) + '</b></div></div>' +
        '<div class="next"><small>งานถัดไป</small>' + escapeHtml(item.nextAction) + '</div>' +
        '<div class="actions"><button class="btn primary" onclick="runAction(\'' + attr(item.action) + '\',\'' + attr(item.customerId) + '\')">ดำเนินการ</button><button class="btn" onclick="showDetails(\'' + attr(item.customerId) + '\')">รายละเอียด</button></div>' +
        '</article>';
    }

    function runAction(action, customerId) {
      var warning = actionWarnings[action] || 'ดำเนินการต่อหรือไม่?';
      if (!window.confirm(warning + '\n\nรหัสลูกค้า: ' + customerId)) return;
      setLoading(true, 'กำลังดำเนินการสำหรับ ' + customerId + '…');
      google.script.run
        .withSuccessHandler(function(response){
          setLoading(false);
          var result = unwrap(response);
          if (!result) return;
          toast(result.message || 'ดำเนินการเรียบร้อย');
          loadDashboard();
        })
        .withFailureHandler(handleFailure)
        .runVideoDashboardAction(action, customerId);
    }

    function showDetails(customerId) {
      setLoading(true, 'กำลังอ่านรายละเอียด…');
      google.script.run
        .withSuccessHandler(function(response){
          setLoading(false);
          var data = unwrap(response);
          if (!data) return;
          document.getElementById('detail-title').textContent = data.businessName + ' · ' + data.customerId;
          document.getElementById('detail-body').innerHTML = renderDetails(data);
          document.getElementById('detail-overlay').classList.add('show');
        })
        .withFailureHandler(handleFailure)
        .getVideoCustomerDetails(customerId);
    }

    function renderDetails(data) {
      var check = data.deliveryCheck || {};
      var basic = [
        ['สถานะโปรไฟล์',data.profileStatus],['สถานะงาน',data.workflowStatus],
        ['อีเมล',data.email],['ประเภทธุรกิจ',data.industry],
        ['สินค้าหรือบริการ',data.service],['กลุ่มเป้าหมาย',data.audience],
        ['โฟลเดอร์รับรูป',data.sourceImagesUrl ? '<a class="link" href="'+attr(data.sourceImagesUrl)+'" target="_blank" rel="noopener">เปิด Google Drive</a>' : '-',true],
        ['โฟลเดอร์วิดีโอสุดท้าย',data.finalVideoUrl ? '<a class="link" href="'+attr(data.finalVideoUrl)+'" target="_blank" rel="noopener">เปิด Google Drive</a>' : '-',true],
        ['ความพร้อมส่งมอบ',check.ready ? 'พร้อมส่งมอบ' : (check.reasons || ['ยังไม่พร้อม']).join('\n')],
        ['ส่งมอบเมื่อ',data.deliveredAt || '-']
      ];
      var html = '<div class="detail-grid">' + basic.map(function(item){ return '<div class="detail"><label>'+escapeHtml(item[0])+'</label><div>'+(item[2] ? item[1] : escapeHtml(item[1]))+'</div></div>'; }).join('') + '</div>';
      html += renderTableSection('ไอเดีย', data.ideas, ['IDEA_ID','CONTENT_ANGLE','APPROVAL','NEEDS_CONFIRMATION']);
      html += renderTableSection('สคริปต์', data.scripts, ['VIDEO_ID','TOPIC','APPROVAL','NEEDS_CONFIRMATION']);
      html += renderTableSection('การผลิตและ QC', data.production, ['VIDEO_ID','FILE_NAME','FILE_STATUS','QC_RESULT','FINAL_APPROVAL','QC_NOTE']);
      html += renderTableSection('ฟีดแบ็ก', data.feedback, ['RECEIVED_AT','REQUEST_TEXT','CATEGORY','RELATED_VIDEO_ID','RECOMMENDED_ACTION']);
      return html;
    }

    function renderTableSection(title, rows, columns) {
      if (!rows || !rows.length) return '<div class="section"><h3>'+escapeHtml(title)+'</h3><div class="empty">ยังไม่มีข้อมูล</div></div>';
      var head = columns.map(function(column){return '<th>'+escapeHtml(column)+'</th>';}).join('');
      var body = rows.map(function(row){return '<tr>'+columns.map(function(column){return '<td>'+escapeHtml(row[column] === undefined ? '' : row[column])+'</td>';}).join('')+'</tr>';}).join('');
      return '<div class="section"><h3>'+escapeHtml(title)+'</h3><div class="table-wrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
    }

    function closeDetails(event) {
      if (event && event.target !== document.getElementById('detail-overlay')) return;
      document.getElementById('detail-overlay').classList.remove('show');
    }

    function unwrap(response) {
      if (!response) { toast('ไม่ได้รับคำตอบจากเซิร์ฟเวอร์', true); return null; }
      if (response.ok === false) { toast(response.error || 'เกิดข้อผิดพลาด', true); return null; }
      return response.result;
    }

    function handleFailure(error) {
      setLoading(false);
      toast(error && error.message ? error.message : String(error || 'เกิดข้อผิดพลาด'), true);
    }

    function setLoading(show, text) {
      document.getElementById('loading-text').textContent = text || 'กำลังดำเนินการ…';
      document.getElementById('loading').classList.toggle('show', !!show);
    }

    function toast(message, isError) {
      var box = document.createElement('div');
      box.className = 'toast' + (isError ? ' error' : '');
      box.textContent = message;
      document.getElementById('toast').appendChild(box);
      setTimeout(function(){box.remove();}, 6500);
    }

    function number(value) { var n = Number(value || 0); return isFinite(n) ? n : 0; }
    function attr(value) { return String(value || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' '); }
    function escapeHtml(value) { return String(value === null || value === undefined ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  </script>
</body>
</html>
