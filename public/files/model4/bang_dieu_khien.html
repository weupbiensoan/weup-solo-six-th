<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --xanh:#144080;
    --xanh-dam:#0C2B57;
    --xanh-sang:#1F5DB0;
    --xanh-mo:#EDF2FA;
    --vang:#B4761E;
    --vang-mo:#FDF6E3;
    --do:#9B2C22;
    --do-mo:#FBEEEC;
    --luc:#1F6B4A;
    --nen:#F4F6F9;
    --duong:#E2E6EC;
    --muc:#1E2530;
    --nhan:#6B7280;
    --chu:'Noto Sans Thai',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--nen);color:var(--muc);font-family:var(--chu);font-size:13.5px;line-height:1.55}
  .trang{padding:18px 22px 40px;max-width:1180px;margin:0 auto}

  .hero{position:relative;overflow:hidden;border-radius:12px;color:#fff;padding:24px 28px 90px;
    background:linear-gradient(135deg,#1B4E96 0%,var(--xanh) 55%,var(--xanh-dam) 100%)}
  .hero::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px)}
  .hero-trong{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72)}
  .hero h1{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:7px 0 8px}
  .hero p{margin:0;font-size:13.5px;color:rgba(255,255,255,.87);max-width:640px}
  .hero-phai{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .luc{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px}
  .cham{width:7px;height:7px;border-radius:50%;background:#F0C36B;display:inline-block}
  button.lam-moi{font-family:var(--chu);font-size:13px;font-weight:600;color:#fff;cursor:pointer;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);border-radius:7px;padding:10px 18px}
  button.lam-moi:hover{background:#fff;color:var(--xanh)}

  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:-64px 12px 0;position:relative;z-index:2}
  .the-kpi{background:#fff;border:1px solid var(--duong);border-top:3px solid var(--xanh);
    border-radius:9px;padding:16px 20px 18px;box-shadow:0 3px 14px rgba(20,64,128,.09)}
  .the-kpi .nhan{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#4B5563}
  .the-kpi .so{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--xanh);line-height:1.15;margin:6px 0 4px;word-break:break-word}
  .the-kpi .chu{font-size:12.5px;color:var(--nhan)}

  .canh-bao{background:var(--vang-mo);border:1px solid #F0E2BE;border-left:4px solid var(--vang);
    border-radius:8px;padding:13px 18px;margin:18px 12px 0}
  .canh-bao div{font-size:13px;margin-bottom:4px}
  .canh-bao div:last-child{margin-bottom:0}
  .canh-bao b{color:var(--do);font-weight:600}

  section{margin:28px 12px 0}
  .tieu-de-khoi{display:flex;align-items:baseline;gap:12px;margin-bottom:13px}
  .tieu-de-khoi h2{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .tieu-de-khoi .nguon{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--nhan)}
  .tieu-de-khoi .ghi{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--xanh)}
  .the{background:#fff;border:1px solid var(--duong);border-radius:9px}

  .viec{padding:16px 20px;border-left:4px solid var(--xanh)}
  .viec .n{font-size:14px;font-weight:600;margin-bottom:4px}
  .viec .m{font-size:13px;color:#3D4655}
  .viec button{margin-top:11px;font-family:var(--chu);font-size:13px;font-weight:600;background:var(--xanh);
    color:#fff;border:none;border-radius:7px;padding:9px 16px;cursor:pointer}
  .viec button:hover{background:var(--xanh-sang)}
  .viec button:disabled{background:#D5D9E0;color:#8A9099;cursor:default}

  table.chiso{width:100%;border-collapse:collapse}
  table.chiso td{padding:9px 14px;border-bottom:1px solid #F0F2F5;font-size:13px}
  table.chiso tr:last-child td{border-bottom:none}
  table.chiso td.ten{color:var(--nhan);width:42%}
  table.chiso td.gt{font-family:var(--mono);font-weight:500;color:var(--muc)}
  table.chiso td.dai{font-family:var(--chu);font-weight:400;color:#3D4655}

  .loi{padding:14px 18px}
  .loi ul{margin:8px 0 0;padding-left:18px}
  .loi li{font-family:var(--mono);font-size:11.5px;color:var(--do);margin-bottom:4px}
  .dat{padding:14px 18px;font-size:13px;color:var(--luc)}

  .bc{padding:16px 20px}
  .bc h4{margin:0 0 5px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--xanh)}
  .bc p{margin:0 0 14px;font-size:13px;color:#3D4655;white-space:pre-wrap}
  .bc p:last-child{margin-bottom:0}
  .nhan-tt{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:4px 10px;border-radius:20px;margin-left:8px}
  .tt-CHO_DUYET{background:var(--vang-mo);color:#8A6410;border:1px solid #F0E2BE}
  .tt-DA_DUYET_GUI{background:var(--xanh-mo);color:var(--xanh);border:1px solid #CBD9EE}
  .tt-DA_GUI{background:#EAF4EF;color:var(--luc);border:1px solid #C9E3D6}
  .tt-LOI,.tt-CAN_SUA_DU_LIEU{background:var(--do-mo);color:var(--do);border:1px solid #F0D6D2}

  .duyet{margin-top:16px;padding-top:14px;border-top:1px solid var(--duong)}
  .duyet label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
  .duyet input{font-family:var(--chu);font-size:13px;padding:9px 12px;border:1px solid var(--duong);
    border-radius:7px;width:260px;background:#FCFDFE;margin-right:10px}
  .duyet button{font-family:var(--chu);font-size:12.5px;font-weight:600;background:var(--luc);color:#fff;
    border:none;border-radius:7px;padding:10px 16px;cursor:pointer}
  .duyet button:hover{background:#17583C}
  .duyet button:disabled{background:#D5D9E0;color:#8A9099;cursor:default}
  .ghi-chu-duyet{font-size:12px;color:var(--nhan);margin-top:9px;max-width:620px}
  #kqDuyet{font-family:var(--mono);font-size:11.5px;color:var(--luc);margin-top:9px;white-space:pre-wrap}

  .rong{font-size:12.5px;color:var(--nhan);background:#fff;border:1px dashed var(--duong);border-radius:9px;padding:15px 17px}
  .nhac{padding:16px 20px;border-left:4px solid var(--vang)}
  .nhac li{margin-bottom:8px;font-size:13px}
  .nhac li:last-child{margin-bottom:0}
  .nhac span{color:var(--nhan)}
  ul{margin:0;padding-left:18px}

  .cai-dat{padding:17px 20px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .cai-dat label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
  .cai-dat input{font-family:var(--mono);font-size:12px;padding:9px 12px;border:1px solid var(--duong);
    border-radius:7px;width:340px;background:#FCFDFE}
  .cai-dat button{font-family:var(--chu);font-size:12.5px;font-weight:600;background:var(--xanh);color:#fff;
    border:none;border-radius:7px;padding:10px 16px;cursor:pointer;margin-top:25px}
  .cai-dat .chu-thich{font-size:12px;color:var(--nhan);max-width:420px;margin-top:25px}
  #kqKhoa,#kqChay,#kqFile{font-family:var(--mono);font-size:11.5px;color:var(--xanh);margin:10px 0 0;white-space:pre-wrap}

  .dang-tai{padding:60px 0;text-align:center;color:var(--nhan);font-family:var(--mono);font-size:12px}
  .loi-tai{border:1px solid #F0D6D2;border-left:4px solid var(--do);background:var(--do-mo);color:var(--do);
    padding:15px 18px;border-radius:8px;font-size:13px;margin:18px 12px 0}

  @media (max-width:760px){ .kpi{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:no-preference){
    .kpi,.canh-bao,section{animation:len .3s ease-out both}
    @keyframes len{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="trang">
  <header class="hero">
    <div class="hero-trong">
      <div>
        <div class="eyebrow">ระบบรายงานยอดขายรายสัปดาห์</div>
        <h1>แดชบอร์ด</h1>
        <p id="moTaKy">โค้ดคำนวณตัวเลขทั้งหมด AI เขียนเฉพาะความคิดเห็น และจะไม่ส่งรายงานก่อนผู้จัดการอนุมัติ</p>
      </div>
      <div class="hero-phai">
        <div class="luc"><span class="cham"></span><span id="capNhat">กำลังโหลด</span></div>
        <button class="lam-moi" onclick="tai()">อัปเดต</button>
      </div>
    </div>
  </header>
  <div id="noiDung"><div class="dang-tai">กำลังอ่านสเปรดชีต…</div></div>
</div>

<script>
function tai(){
  document.getElementById('noiDung').innerHTML = '<div class="dang-tai">กำลังอ่านสเปรดชีต…</div>';
  google.script.run
    .withSuccessHandler(ve)
    .withFailureHandler(function(e){
      document.getElementById('noiDung').innerHTML =
        '<div class="loi-tai"><b>ไม่สามารถอ่านข้อมูลได้</b><br>' + esc(e.message) +
        '<br>หากยังไม่มีชีต ให้เรียกเมนู รายงานประจำสัปดาห์ → 1. สร้างโครงสร้างชีต</div>';
    })
    .layDuLieuBangDieuKhien();
}

function esc(s){
  return String(s===null||s===undefined?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function soTien(n){ return '฿' + Number(n||0).toLocaleString('th-TH'); }

function ve(d){
  document.getElementById('capNhat').textContent = 'อัปเดต ' + d.capNhatLuc;
  document.getElementById('moTaKy').textContent =
    'รอบรายงาน ' + d.ky.ma + ' ตั้งแต่ ' + d.ky.tuNgay + ' ถึง ' + d.ky.denNgay +
    ' โค้ดคำนวณตัวเลขทั้งหมด AI เขียนเฉพาะความคิดเห็น และจะไม่ส่งรายงานก่อนผู้จัดการอนุมัติ';
  var h = '';

  h += '<div class="kpi">';
  d.kpi.forEach(function(k){
    var so = k.kieu === 'tien' ? soTien(k.so) : esc(k.so);
    h += '<div class="the-kpi"><div class="nhan">' + esc(k.nhan) + '</div>' +
         '<div class="so">' + so + '</div><div class="chu">' + esc(k.chu) + '</div></div>';
  });
  h += '</div>';

  if(d.canhBao.length){
    h += '<div class="canh-bao">';
    d.canhBao.forEach(function(c){
      h += '<div><b>' + esc(c.nhan) + '</b> ' + esc(c.noiDung) + '</div>';
    });
    h += '</div>';
  }

  h += '<section><div class="tieu-de-khoi"><h2>ขั้นตอนถัดไป</h2>' +
       '<div class="nguon">รอบ ' + esc(d.ky.ma) + '</div></div>' +
       '<div class="the viec"><div class="n">' + esc(d.viecTiepTheo.viec) + '</div>';
  if(d.viecTiepTheo.hanhDong){
    h += '<button id="nutChay" onclick="chay(\'' + esc(d.viecTiepTheo.hanhDong) + '\')">' +
         esc(d.viecTiepTheo.nhan) + '</button>';
  }
  h += '<div id="kqChay"></div></div></section>';

  h += '<section><div class="tieu-de-khoi"><h2>ตรวจสอบข้อมูล</h2>' +
       '<div class="nguon">ชีต ข้อมูลรายวัน</div>' +
       '<div class="ghi">' + d.duLieu.soDong + ' แถวในรอบ</div></div><div class="the">';
  if(d.duLieu.dat){
    h += '<div class="dat">ข้อมูลผ่านการตรวจสอบ ช่องบังคับว่าง ' + d.duLieu.tyLeTrong + '%' +
         (d.duLieu.ngoaiKy ? ' ข้ามข้อมูลจากรอบอื่น ' + d.duLieu.ngoaiKy + ' แถว' : '') + '</div>';
  } else {
    h += '<div class="loi"><b>ต้องแก้ข้อผิดพลาด ' + d.duLieu.tongLoi + ' รายการก่อนคำนวณ</b><ul>';
    d.duLieu.loi.forEach(function(l){ h += '<li>' + esc(l) + '</li>'; });
    if(d.duLieu.tongLoi > d.duLieu.loi.length){
      h += '<li>… ยังมีอีก ' + (d.duLieu.tongLoi - d.duLieu.loi.length) + ' รายการ โปรดดูชีต บันทึกระบบ</li>';
    }
    h += '</ul></div>';
  }
  h += '</div></section>';

  h += '<section><div class="tieu-de-khoi"><h2>ตัวชี้วัดรายสัปดาห์</h2>' +
       '<div class="nguon">ชีต ตัวชี้วัดรายสัปดาห์</div></div>';
  if(!d.chiSo){
    h += '<div class="rong">ยังไม่มีตัวชี้วัดสำหรับรอบนี้ เรียกเมนู 3 เพื่อคำนวณและแสดงข้อมูลในส่วนนี้</div>';
  } else {
    h += '<div class="the"><table class="chiso">';
    d.chiSo.forEach(function(c){
      var gt = c.dai ? esc(c.gt) : (typeof c.gt === 'number' ? c.gt.toLocaleString('th-TH') : esc(c.gt));
      h += '<tr><td class="ten">' + esc(c.ten) + '</td>' +
           '<td class="gt' + (c.dai ? ' dai' : '') + '">' + gt + esc(c.donVi) + '</td></tr>';
    });
    h += '</table></div>';
  }
  h += '</section>';

  h += '<section><div class="tieu-de-khoi"><h2>รายงาน</h2>' +
       '<div class="nguon">ชีต รายงาน AI</div></div>';
  if(!d.baoCao){
    h += '<div class="rong">ยังไม่มีรายงานสำหรับรอบนี้ เรียกเมนู 4 เพื่อสร้างร่างความคิดเห็นด้วย AI</div>';
  } else {
    h += '<div class="the bc"><div style="margin-bottom:12px"><span style="font-family:var(--mono);font-size:12px">' +
         esc(d.baoCao.ma) + '</span><span class="nhan-tt tt-' + esc(d.baoCao.trangThai) + '">' +
         esc(d.baoCao.trangThaiHienThi) + '</span>' +
         (d.baoCao.nguoiDuyet ? '<span style="font-size:12px;color:var(--nhan);margin-left:10px">ผู้อนุมัติ: ' + esc(d.baoCao.nguoiDuyet) + '</span>' : '') +
         '</div>';
    if(d.baoCao.trangThai === 'LOI'){
      h += '<h4>คำตอบดิบที่เกิดข้อผิดพลาด</h4><p>' + esc(d.baoCao.jsonTho.slice(0,1500)) + '</p>';
    } else {
      h += '<h4>ภาพรวม</h4><p>' + esc(d.baoCao.tongQuan) + '</p>' +
           '<h4>คำเตือน</h4><p>' + esc(d.baoCao.canhBao) + '</p>' +
           '<h4>การดำเนินการที่แนะนำ</h4><p>' + esc(d.baoCao.hanhDong) + '</p>' +
           '<h4>คำถามสำหรับผู้จัดการ</h4><p>' + esc(d.baoCao.cauHoi) + '</p>';
      if(d.baoCao.trangThai === 'CHO_DUYET'){
        h += '<div class="duyet"><label for="oDuyet">ผู้อนุมัติ</label>' +
             '<input id="oDuyet" type="text" placeholder="กรอกชื่อแล้วกดอนุมัติ">' +
             '<button onclick="duyet(\'' + esc(d.baoCao.ma) + '\')">อนุมัติรายงาน</button>' +
             '<div class="ghi-chu-duyet">การอนุมัติหมายถึงคุณอ่านและรับผิดชอบต่อเนื้อหาแล้ว ' +
             'หากต้องแก้ข้อความ ให้แก้ในชีต รายงาน AI ก่อนแล้วจึงกลับมาอนุมัติ</div>' +
             '<div id="kqDuyet"></div></div>';
      }
    }
    h += '</div>';
  }
  h += '</section>';

  h += '<section><div class="tieu-de-khoi"><h2>ระบบช่วยเตือน แต่ไม่ตัดสินใจแทน</h2></div>' +
       '<div class="the nhac"><ul>';
  d.nhacNho.forEach(function(n){
    h += '<li><b>' + esc(n.viec) + '</b> — <span>' + esc(n.vi) + '</span></li>';
  });
  h += '</ul></div></section>';

  h += '<section><div class="tieu-de-khoi"><h2>แหล่งข้อมูล</h2>' +
       '<div class="nguon">' + esc(d.nguon.noi) + '</div></div>' +
       '<div class="the cai-dat">' +
       '<div><label for="oFile">ลิงก์ไฟล์ข้อมูลของลูกค้า</label>' +
       '<input id="oFile" type="text" value="' + esc(d.nguon.id) + '" placeholder="วางลิงก์ Google Sheets ของลูกค้า"></div>' +
       '<button onclick="luuFile()">เชื่อมไฟล์</button>' +
       '<div class="chu-thich">' + esc(d.nguon.chu) + '</div></div><div id="kqFile"></div></section>';

  h += '<section><div class="tieu-de-khoi"><h2>การตั้งค่า</h2><div class="nguon">Script Properties</div></div>' +
       '<div class="the cai-dat">' +
       '<div><label for="oKhoa">OPENAI_API_KEY</label>' +
       '<input id="oKhoa" type="password" placeholder="วางคีย์แล้วกดบันทึก" autocomplete="off"></div>' +
       '<button onclick="luuKhoa()">บันทึกคีย์</button>' +
       '<div class="chu-thich">คีย์จะบันทึกใน Script Properties ของโปรเจกต์ ไม่เขียนลงสเปรดชีตหรือซอร์สโค้ด ' +
       'หลังบันทึกให้เรียกเมนู 6 เพื่อตรวจสอบการเชื่อมต่อ</div></div><div id="kqKhoa"></div></section>';

  document.getElementById('noiDung').innerHTML = h;
}

function chay(hanhDong){
  var nut = document.getElementById('nutChay');
  var kq = document.getElementById('kqChay');
  var nhanCu = nut ? nut.textContent : '';
  if(nut){ nut.disabled = true; nut.textContent = 'กำลังทำงาน…'; }
  kq.textContent = 'กำลังส่งคำสั่งไปยังสเปรดชีต…';
  google.script.run
    .withSuccessHandler(function(r){ kq.textContent = r; setTimeout(tai, 1600); })
    .withFailureHandler(function(e){
      kq.textContent = 'ข้อผิดพลาด: ' + e.message;
      if(nut){ nut.disabled = false; nut.textContent = nhanCu; }
    })
    .chayHanhDong(hanhDong);
}

function duyet(ma){
  var o = document.getElementById('oDuyet');
  var kq = document.getElementById('kqDuyet');
  if(!o.value.trim()){ kq.textContent = 'ยังไม่ได้กรอกชื่อผู้อนุมัติ'; return; }
  var nut = o.parentNode.querySelector('button');
  nut.disabled = true; nut.textContent = 'กำลังอนุมัติ…';
  kq.textContent = '';
  google.script.run
    .withSuccessHandler(function(r){ kq.textContent = r; setTimeout(tai, 1500); })
    .withFailureHandler(function(e){
      kq.textContent = 'ข้อผิดพลาด: ' + e.message;
      nut.disabled = false; nut.textContent = 'อนุมัติรายงาน';
    })
    .duyetBaoCao(ma, o.value.trim());
}

function luuFile(){
  var o = document.getElementById('oFile');
  var kq = document.getElementById('kqFile');
  kq.textContent = 'กำลังตรวจสอบไฟล์…';
  google.script.run
    .withSuccessHandler(function(r){ kq.textContent = r; setTimeout(tai, 1600); })
    .withFailureHandler(function(e){ kq.textContent = 'ข้อผิดพลาด: ' + e.message; })
    .luuFileKhach(o.value.trim());
}

function luuKhoa(){
  var o = document.getElementById('oKhoa');
  var kq = document.getElementById('kqKhoa');
  if(!o.value.trim()){ kq.textContent = 'ยังไม่ได้กรอก API key'; return; }
  kq.textContent = 'กำลังบันทึก…';
  google.script.run
    .withSuccessHandler(function(r){ kq.textContent = r; o.value=''; setTimeout(tai, 1400); })
    .withFailureHandler(function(e){ kq.textContent = 'ข้อผิดพลาด: ' + e.message; })
    .luuKhoaAPI(o.value.trim());
}

tai();
